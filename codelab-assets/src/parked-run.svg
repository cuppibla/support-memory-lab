<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="llm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#94A3B8"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#10B981"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="#FFFFFF"/>
  <text x="70" y="64" font-family='-apple-system,"SF Pro Text","Helvetica Neue",Arial' font-size="34" font-weight="700" fill="#0F172A">The parked run: how a different process resumes the conversation</text>
  <text x="70" y="98" font-family='-apple-system,"SF Pro Text","Helvetica Neue",Arial' font-size="20" fill="#64748B">A LongRunningFunctionTool ends the turn with an open call in the session file — any process that can read the file can answer it.</text>

  <!-- adk web process container -->
  <rect x="70" y="150" width="880" height="250" rx="18" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="90" y="178" font-family='"SF Mono",Menlo,Consolas' font-size="14" fill="#334155">adk web · :8000 (Maya's side)</text>

  <rect x="100" y="220" width="220" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="120" y="253" font-family='"SF Mono",Menlo,Consolas' font-size="15" fill="#0F172A">Maya's turn</text>
  <text x="120" y="277" font-family='"SF Mono",Menlo,Consolas' font-size="12.5" fill="#64748B">"$80 refund, order 8841"</text>

  <rect x="380" y="212" width="230" height="96" rx="16" fill="url(#llm)"/>
  <text x="405" y="255" font-family='"SF Mono",Menlo,Consolas' font-size="16" font-weight="700" fill="#FFFFFF">✦ iris</text>
  <text x="405" y="282" font-family='"SF Mono",Menlo,Consolas' font-size="12.5" fill="#E0E7FF">runs the turn</text>

  <rect x="670" y="212" width="250" height="96" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="690" y="248" font-family='"SF Mono",Menlo,Consolas' font-size="14" fill="#92400E">⏸ LongRunningFunctionTool</text>
  <text x="690" y="270" font-family='"SF Mono",Menlo,Consolas' font-size="13" fill="#92400E">(escalate_refund)</text>
  <text x="690" y="292" font-family='"SF Mono",Menlo,Consolas' font-size="12" fill="#B45309">returns pending → turn ENDS</text>

  <!-- session file -->
  <rect x="620" y="470" width="360" height="100" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="640" y="503" font-family='"SF Mono",Menlo,Consolas' font-size="15" fill="#0F172A">lumen.db</text>
  <text x="640" y="526" font-family='"SF Mono",Menlo,Consolas' font-size="12.5" fill="#64748B">event: long_running_tool_ids</text>
  <text x="640" y="544" font-family='"SF Mono",Menlo,Consolas' font-size="12.5" fill="#64748B">= [call_id]  · answer: none yet</text>

  <!-- supervisor container -->
  <rect x="1060" y="150" width="470" height="250" rx="18" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1080" y="178" font-family='"SF Mono",Menlo,Consolas' font-size="14" fill="#334155">supervisor.py · a SEPARATE process</text>
  <rect x="1090" y="212" width="410" height="96" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1110" y="245" font-family='"SF Mono",Menlo,Consolas' font-size="14" fill="#047857">find the un-answered call</text>
  <text x="1110" y="268" font-family='"SF Mono",Menlo,Consolas' font-size="12.5" fill="#64748B">SqliteSessionService(db_path="lumen.db")</text>
  <text x="1110" y="288" font-family='"SF Mono",Menlo,Consolas' font-size="12.5" fill="#64748B">print history → human reads → Enter</text>

  <!-- terminal success -->
  <rect x="1090" y="470" width="440" height="90" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="1110" y="505" font-family='"SF Mono",Menlo,Consolas' font-size="15" fill="#047857">✓ run resumes in the session</text>
  <text x="1110" y="530" font-family='"SF Mono",Menlo,Consolas' font-size="12.5" fill="#64748B">"approved — refund in 3-5 days"</text>

  <!-- edges -->
  <g stroke="#94A3B8" stroke-width="2" fill="none">
    <path d="M320 260 L 376 260" marker-end="url(#arr)"/>
    <path d="M610 260 L 666 260" marker-end="url(#arr)"/>
    <path d="M795 308 L 795 466" stroke-dasharray="6 5" marker-end="url(#arr)"/>
    <path d="M1180 400 C 1150 440, 1060 500, 984 512" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  </g>
  <path d="M1295 308 L 1295 466" stroke="#8B5CF6" stroke-width="2.5" fill="none" marker-end="url(#arrP)"/>
  <path d="M980 540 L 1030 540 L 1086 528" stroke="#10B981" stroke-width="2.5" fill="none" marker-end="url(#arrG)" opacity="0"/>

  <!-- edge labels -->
  <g font-family='"SF Mono",Menlo,Consolas' font-size="13">
    <text x="815" y="390" fill="#64748B">the parked call is written to disk</text>
    <text x="1005" y="452" fill="#64748B">reads the same file</text>
    <text x="1318" y="424" fill="#8B5CF6" font-weight="700">FunctionResponse(</text>
    <text x="1318" y="444" fill="#8B5CF6" font-weight="700">  id=call_id, "approved")</text>
  </g>

  <!-- step circles -->
  <g font-family='-apple-system,Arial' font-size="14" font-weight="700">
    <circle cx="348" cy="242" r="15" fill="#0F172A"/><text x="348" y="247" fill="#FFF" text-anchor="middle">1</text>
    <circle cx="638" cy="242" r="15" fill="#0F172A"/><text x="638" y="247" fill="#FFF" text-anchor="middle">2</text>
    <circle cx="795" cy="430" r="15" fill="#0F172A"/><text x="795" y="435" fill="#FFF" text-anchor="middle">3</text>
    <circle cx="1076" cy="470" r="15" fill="#0F172A"/><text x="1076" y="475" fill="#FFF" text-anchor="middle">4</text>
    <circle cx="1295" cy="392" r="15" fill="#0F172A"/><text x="1295" y="397" fill="#FFF" text-anchor="middle">5</text>
  </g>

  <!-- caveat -->
  <rect x="70" y="620" width="1460" height="60" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
  <text x="90" y="646" font-family='-apple-system,Arial' font-size="15" font-weight="700" fill="#92400E">An ordinary tool never parks — the turn runs straight through it.</text>
  <text x="90" y="668" font-family='-apple-system,Arial' font-size="14" fill="#B45309">Only a LongRunningFunctionTool leaves an open call behind; the FunctionResponse must carry the SAME call_id and tool name to resume it.</text>
</svg>
