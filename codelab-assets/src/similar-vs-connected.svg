<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#94A3B8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#10B981"/>
    </marker>
  </defs>
  <rect width="1600" height="800" fill="#FFFFFF"/>
  <text x="70" y="64" font-family='-apple-system,"SF Pro Text","Helvetica Neue",Arial' font-size="34" font-weight="700" fill="#0F172A">Similar is not connected: two ways to read the same tickets</text>
  <text x="70" y="98" font-family='-apple-system,"SF Pro Text","Helvetica Neue",Arial' font-size="20" fill="#64748B">Both tools query lumen_world.db. One matches words; one walks the keys that tie Maya to a known defect.</text>

  <!-- question -->
  <rect x="150" y="150" width="420" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="170" y="183" font-family='"SF Mono",Menlo,Consolas' font-size="15" fill="#0F172A">"Is my problem a known issue?</text>
  <text x="170" y="207" font-family='"SF Mono",Menlo,Consolas' font-size="15" fill="#0F172A"> My order number is 8841."</text>

  <!-- lane A: text search -->
  <rect x="70" y="290" width="1460" height="180" rx="18" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="90" y="318" font-family='"SF Mono",Menlo,Consolas' font-size="14" fill="#334155">lane A — search_tickets(text): similarity</text>

  <rect x="110" y="345" width="300" height="90" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="130" y="378" font-family='"SF Mono",Menlo,Consolas' font-size="15" fill="#0F172A">search_tickets</text>
  <text x="130" y="402" font-family='"SF Mono",Menlo,Consolas' font-size="12.5" fill="#64748B">t.text LIKE '%flick%' OR …</text>

  <rect x="530" y="345" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="550" y="378" font-family='"SF Mono",Menlo,Consolas' font-size="15" fill="#0F172A">tickets (40 rows)</text>
  <text x="550" y="402" font-family='"SF Mono",Menlo,Consolas' font-size="12.5" fill="#64748B">text only — no keys walked</text>

  <rect x="950" y="345" width="560" height="90" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="970" y="378" font-family='"SF Mono",Menlo,Consolas' font-size="15" fill="#92400E">40 matches · 3 product lines</text>
  <text x="970" y="402" font-family='"SF Mono",Menlo,Consolas' font-size="12.5" fill="#B45309">sounds helpful · cannot connect ANY of them to Maya</text>

  <!-- lane B: traversal -->
  <rect x="70" y="500" width="1460" height="190" rx="18" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="90" y="528" font-family='"SF Mono",Menlo,Consolas' font-size="14" fill="#334155">lane B — check_known_issue(order_number): one governed traversal, one parameter — the agent never writes SQL</text>

  <g font-family='"SF Mono",Menlo,Consolas'>
    <rect x="110" y="560" width="180" height="80" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="130" y="592" font-size="14" fill="#047857">orders</text>
    <text x="130" y="614" font-size="12" fill="#64748B">id = 8841</text>

    <rect x="360" y="560" width="200" height="80" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="380" y="592" font-size="14" fill="#047857">products</text>
    <text x="380" y="614" font-size="12" fill="#64748B">LumenGlow v2</text>

    <rect x="630" y="560" width="170" height="80" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="650" y="592" font-size="14" fill="#047857">batches</text>
    <text x="650" y="614" font-size="12" fill="#64748B">B7</text>

    <rect x="870" y="560" width="200" height="80" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="890" y="592" font-size="14" fill="#047857">tickets</text>
    <text x="890" y="614" font-size="12" fill="#64748B">COUNT(*) = 37</text>

    <rect x="1140" y="560" width="390" height="80" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="1160" y="592" font-size="14" fill="#047857">✓ defects: driver defect</text>
    <text x="1160" y="614" font-size="12" fill="#64748B">fix = firmware 2.1 · path quoted to Maya</text>
  </g>

  <!-- edges -->
  <g stroke="#94A3B8" stroke-width="2" fill="none">
    <path d="M300 230 L 300 341" marker-end="url(#arr)"/>
    <path d="M200 230 L 110 230 L 110 520 L 90 520 L 90 600 L 106 600" marker-end="url(#arr)"/>
    <path d="M410 390 L 526 390" marker-end="url(#arr)" stroke-dasharray="6 5"/>
    <path d="M810 390 L 946 390" marker-end="url(#arr)" stroke-dasharray="6 5"/>
  </g>
  <g stroke="#10B981" stroke-width="2.5" fill="none">
    <path d="M290 600 L 356 600" marker-end="url(#arrG)"/>
    <path d="M560 600 L 626 600" marker-end="url(#arrG)"/>
    <path d="M800 600 L 866 600" marker-end="url(#arrG)"/>
    <path d="M1070 600 L 1136 600" marker-end="url(#arrG)"/>
  </g>

  <!-- fk labels -->
  <g font-family='"SF Mono",Menlo,Consolas' font-size="12" fill="#047857">
    <text x="292" y="585">product_id</text>
    <text x="566" y="585">batch_id</text>
    <text x="806" y="585">batch_id</text>
    <text x="1076" y="585">batch_id</text>
  </g>

  <!-- step circles lane B -->
  <g font-family='-apple-system,Arial' font-size="14" font-weight="700">
    <circle cx="322" cy="600" r="15" fill="#0F172A"/><text x="322" y="605" fill="#FFF" text-anchor="middle">1</text>
    <circle cx="592" cy="600" r="15" fill="#0F172A"/><text x="592" y="605" fill="#FFF" text-anchor="middle">2</text>
    <circle cx="832" cy="600" r="15" fill="#0F172A"/><text x="832" y="605" fill="#FFF" text-anchor="middle">3</text>
    <circle cx="1102" cy="600" r="15" fill="#0F172A"/><text x="1102" y="605" fill="#FFF" text-anchor="middle">4</text>
  </g>

  <!-- caveat -->
  <rect x="70" y="716" width="1460" height="60" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
  <text x="90" y="742" font-family='-apple-system,Arial' font-size="15" font-weight="700" fill="#92400E">In production this is one statement away: CREATE PROPERTY GRAPH over the tables you already have (BigQuery).</text>
  <text x="90" y="764" font-family='-apple-system,Arial' font-size="14" fill="#B45309">Vector search finds where to look · graph traversal finds what's connected · the model answers with the trail.</text>
</svg>
