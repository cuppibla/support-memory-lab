<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="770" viewBox="0 0 1150 770">
  <defs>
    <linearGradient id="llm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="1150" height="770" fill="#FFFFFF"/>

  <text x="70" y="80" font-family='-apple-system,"SF Pro Text","Helvetica Neue",Arial' font-size="46" font-weight="800" fill="#0F172A" letter-spacing="-1">The four memories of an agent</text>
  <text x="70" y="116" font-family='-apple-system,"SF Pro Text","Helvetica Neue",Arial' font-size="21" fill="#94A3B8">What each one holds — and where it lives on Google Cloud</text>

  <line x1="575" y1="168" x2="575" y2="690" stroke="#E8EBF0" stroke-width="1.5"/>
  <line x1="70" y1="426" x2="1080" y2="426" stroke="#E8EBF0" stroke-width="1.5"/>

  <!-- ============ WORKING ============ -->
  <rect x="70" y="192" width="40" height="7" rx="3.5" fill="#4F46E5"/>
  <text x="126" y="204" font-family='-apple-system,"SF Pro Text",Arial' font-size="17" font-weight="700" fill="#4F46E5" letter-spacing="1.8">ONE CONVERSATION</text>
  <text x="70" y="278" font-family='-apple-system,"SF Pro Text",Arial' font-size="66" font-weight="800" fill="#3730A3" letter-spacing="-2">Working</text>
  <text x="70" y="320" font-family='-apple-system,"SF Pro Text",Arial' font-size="23" fill="#64748B">the now — this conversation</text>
  <rect x="70" y="350" width="204" height="56" rx="28" fill="#0F172A"/>
  <text x="172" y="387" font-family='"SF Mono",Menlo,Consolas' font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">ADK Session</text>
  <g transform="translate(444,210) scale(1.7)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <rect x="3" y="4" width="40" height="30" rx="9"/>
    <path d="M15 34 L15 44 L26 34"/>
  </g>

  <!-- ============ EPISODIC ============ -->
  <rect x="625" y="192" width="40" height="7" rx="3.5" fill="#F59E0B"/>
  <text x="681" y="204" font-family='-apple-system,"SF Pro Text",Arial' font-size="17" font-weight="700" fill="#B45309" letter-spacing="1.8">REPLAYABLE</text>
  <text x="625" y="278" font-family='-apple-system,"SF Pro Text",Arial' font-size="66" font-weight="800" fill="#B45309" letter-spacing="-2">Episodic</text>
  <text x="625" y="320" font-family='-apple-system,"SF Pro Text",Arial' font-size="23" fill="#64748B">what happened — events to revisit</text>
  <rect x="625" y="350" width="178" height="56" rx="28" fill="#0F172A"/>
  <text x="714" y="387" font-family='"SF Mono",Menlo,Consolas' font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Cloud SQL</text>
  <rect x="819" y="350" width="104" height="56" rx="28" fill="#334155"/>
  <text x="871" y="387" font-family='"SF Mono",Menlo,Consolas' font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">GCS</text>
  <g transform="translate(985,210) scale(1.7)" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <rect x="3" y="16" width="28" height="26" rx="5"/>
    <rect x="10" y="10" width="28" height="26" rx="5"/>
    <rect x="17" y="4" width="28" height="26" rx="5"/>
  </g>

  <!-- ============ SEMANTIC ============ -->
  <rect x="70" y="474" width="40" height="7" rx="3.5" fill="#8B5CF6"/>
  <text x="126" y="486" font-family='-apple-system,"SF Pro Text",Arial' font-size="17" font-weight="700" fill="#6D28D9" letter-spacing="1.8">SEARCHABLE</text>
  <text x="70" y="560" font-family='-apple-system,"SF Pro Text",Arial' font-size="66" font-weight="800" fill="#6D28D9" letter-spacing="-2">Semantic</text>
  <text x="70" y="602" font-family='-apple-system,"SF Pro Text",Arial' font-size="23" fill="#64748B">what is true — distilled facts</text>
  <rect x="70" y="632" width="204" height="56" rx="28" fill="url(#llm)"/>
  <text x="172" y="669" font-family='"SF Mono",Menlo,Consolas' font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Memory Bank</text>
  <rect x="290" y="632" width="166" height="56" rx="28" fill="#0F172A"/>
  <text x="373" y="669" font-family='"SF Mono",Menlo,Consolas' font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">BigQuery</text>
  <g transform="translate(444,492) scale(1.7)" fill="none" stroke="#8B5CF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.38">
    <path d="M10 35 L24 9 L40 31 Z"/>
    <circle cx="10" cy="35" r="4.5" fill="#8B5CF6" stroke="none"/>
    <circle cx="24" cy="9" r="4.5" fill="#8B5CF6" stroke="none"/>
    <circle cx="40" cy="31" r="4.5" fill="#8B5CF6" stroke="none"/>
  </g>

  <!-- ============ PROCEDURAL ============ -->
  <rect x="625" y="474" width="40" height="7" rx="3.5" fill="#CBD5E1"/>
  <text x="681" y="486" font-family='-apple-system,"SF Pro Text",Arial' font-size="17" font-weight="700" fill="#B6C2D2" letter-spacing="1.8">ITS OWN LAB</text>
  <text x="625" y="560" font-family='-apple-system,"SF Pro Text",Arial' font-size="66" font-weight="800" fill="#B6C2D2" letter-spacing="-2">Procedural</text>
  <text x="625" y="602" font-family='-apple-system,"SF Pro Text",Arial' font-size="23" fill="#C3CCD8">how to act — skills &amp; habits</text>
  <rect x="625" y="632" width="278" height="56" rx="28" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="764" y="669" font-family='"SF Mono",Menlo,Consolas' font-size="20" font-weight="700" fill="#B6C2D2" text-anchor="middle">agent instruction</text>
  <g transform="translate(985,492) scale(1.7)" fill="none" stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12 l4.5 4.5 l9 -10"/><path d="M24 12 H45"/>
    <path d="M3 25 l4.5 4.5 l9 -10"/><path d="M24 25 H45"/>
    <path d="M3 38 l4.5 4.5 l9 -10"/><path d="M24 38 H45"/>
  </g>

  <text x="70" y="742" font-family='-apple-system,"SF Pro Text",Arial' font-size="19" fill="#94A3B8">This lab builds the first three — each one a write policy plus a recall policy you choose.</text>
</svg>
