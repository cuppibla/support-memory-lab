<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="llm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#94A3B8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#10B981"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="#FFFFFF"/>
  <text x="70" y="60" font-family='-apple-system,"SF Pro Text","Helvetica Neue",Arial' font-size="30" font-weight="700" fill="#0F172A">GCS → BigQuery → vectors, without the data ever leaving</text>
  <text x="70" y="92" font-family='-apple-system,"SF Pro Text","Helvetica Neue",Arial' font-size="18" fill="#64748B">Files become tables, tables call Vertex through a connection, and the embeddings land beside the rows they came from.</text>

  <!-- repo container -->
  <rect x="70" y="150" width="280" height="140" rx="18" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="90" y="178" font-family='"SF Mono",Menlo,Consolas' font-size="13" fill="#334155">Cloud Shell · the repo</text>
  <rect x="95" y="195" width="230" height="75" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="115" y="226" font-family='"SF Mono",Menlo,Consolas' font-size="14" fill="#0F172A">warehouse/*.csv</text>
  <text x="115" y="248" font-family='"SF Mono",Menlo,Consolas' font-size="12" fill="#64748B">6 files · explicit columns</text>

  <!-- GCS -->
  <rect x="440" y="180" width="250" height="90" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="460" y="214" font-family='"SF Mono",Menlo,Consolas' font-size="14" fill="#0F172A">gs://…-lumen/</text>
  <text x="460" y="238" font-family='"SF Mono",Menlo,Consolas' font-size="12" fill="#64748B">Cloud Storage bucket</text>

  <!-- BQ container -->
  <rect x="790" y="130" width="740" height="440" rx="18" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="810" y="158" font-family='"SF Mono",Menlo,Consolas' font-size="13" fill="#334155">BigQuery · dataset lumen</text>

  <rect x="820" y="180" width="270" height="90" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="840" y="212" font-family='"SF Mono",Menlo,Consolas' font-size="14" fill="#0F172A">6 tables</text>
  <text x="840" y="234" font-family='"SF Mono",Menlo,Consolas' font-size="12" fill="#64748B">customers · orders · tickets…</text>

  <rect x="1210" y="180" width="290" height="90" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1230" y="212" font-family='"SF Mono",Menlo,Consolas' font-size="14" fill="#0F172A">ticket_embeddings</text>
  <text x="1230" y="234" font-family='"SF Mono",Menlo,Consolas' font-size="12" fill="#64748B">40 rows × 3072 dims</text>

  <rect x="820" y="420" width="270" height="110" rx="16" fill="url(#llm)"/>
  <text x="845" y="458" font-family='"SF Mono",Menlo,Consolas' font-size="14" font-weight="700" fill="#FFFFFF">✦ lumen.embedder</text>
  <text x="845" y="482" font-family='"SF Mono",Menlo,Consolas' font-size="12" fill="#E0E7FF">REMOTE MODEL</text>
  <text x="845" y="502" font-family='"SF Mono",Menlo,Consolas' font-size="12" fill="#E0E7FF">gemini-embedding-001</text>

  <rect x="1210" y="430" width="290" height="90" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1230" y="462" font-family='"SF Mono",Menlo,Consolas' font-size="14" fill="#0F172A">connection US.vertex_conn</text>
  <text x="1230" y="486" font-family='"SF Mono",Menlo,Consolas' font-size="12" fill="#64748B">its SA → roles/aiplatform.user</text>

  <!-- Vertex outside -->
  <rect x="440" y="430" width="250" height="90" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="460" y="462" font-family='"SF Mono",Menlo,Consolas' font-size="14" fill="#0F172A">Vertex AI</text>
  <text x="460" y="486" font-family='"SF Mono",Menlo,Consolas' font-size="12" fill="#64748B">the embedding endpoint</text>

  <!-- edges -->
  <g stroke="#94A3B8" stroke-width="2" fill="none">
    <path d="M350 230 L 436 228" marker-end="url(#arr)"/>
    <path d="M690 225 L 816 225" marker-end="url(#arr)"/>
    <path d="M1090 225 L 1206 225" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrG)"/>
    <path d="M1210 470 L 1094 470" marker-end="url(#arr)"/>
    <path d="M820 470 L 694 470" marker-end="url(#arr)"/>
    <path d="M955 420 L 955 274" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  </g>

  <!-- edge labels -->
  <g font-family='"SF Mono",Menlo,Consolas' font-size="12.5" fill="#64748B">
    <text x="332" y="258" font-size="11.5">gcloud storage cp</text>
    <text x="678" y="200" font-size="11.5">bq load + schema</text>
    <text x="1104" y="192" fill="#047857" font-weight="700" font-size="11.5">ML.GENERATE_</text>
    <text x="1104" y="208" fill="#047857" font-weight="700" font-size="11.5">EMBEDDING</text>
    <text x="1108" y="452">grants access</text>
    <text x="712" y="452">calls through</text>
    <text x="968" y="350">reads the rows in place</text>
  </g>

  <!-- step circles -->
  <g font-family='-apple-system,Arial' font-size="14" font-weight="700">
    <circle cx="392" cy="228" r="15" fill="#0F172A"/><text x="392" y="233" fill="#FFF" text-anchor="middle">1</text>
    <circle cx="752" cy="225" r="15" fill="#0F172A"/><text x="752" y="230" fill="#FFF" text-anchor="middle">2</text>
    <circle cx="1010" cy="330" r="15" fill="#0F172A"/><text x="1010" y="335" fill="#FFF" text-anchor="middle">3</text>
    <circle cx="1148" cy="225" r="15" fill="#0F172A"/><text x="1148" y="230" fill="#FFF" text-anchor="middle">4</text>
  </g>

  <!-- caveat -->
  <rect x="70" y="610" width="1460" height="56" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
  <text x="90" y="634" font-family='-apple-system,Arial' font-size="15" font-weight="700" fill="#92400E">① files to the bucket → ② bucket to typed tables → ③ the remote model embeds rows where they live → ④ vectors land next to the data.</text>
  <text x="90" y="656" font-family='-apple-system,Arial' font-size="14" fill="#B45309">VECTOR_SEARCH then answers meaning-questions in SQL — and the governed tools in part 3 are the only door Iris gets.</text>
</svg>
